<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Exam Performance Indicator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #e0e7ff, #f3f4f8);
    }
    .card-form {
      max-width: 560px;
      margin: 40px auto;
      padding: 32px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    .card-form h1 { font-size: 1.7rem; font-weight: 700; }
    .card-form .subtitle { color: #6b7280; margin-bottom: 24px; }
    .form-label { font-weight: 600; font-size: 0.9rem; }
    .btn-primary { padding: 12px; font-weight: 600; }
    .result {
      margin-top: 24px;
      padding: 16px;
      text-align: center;
      background: #eef2ff;
      border-radius: 10px;
      font-size: 1.1rem;
    }
    .result strong { color: #4f46e5; font-size: 1.5rem; }
  </style>
</head>
<body>
  <div class="card-form">
    <h1 class="text-center">Student Exam Performance Indicator</h1>
    <p class="subtitle text-center">Enter the student's details to predict the maths score.</p>

    <form action="{{ url_for('predict_datapoint') }}" method="post">

      <div class="mb-3">
        <label class="form-label" for="gender">Gender</label>
        <select class="form-select" id="gender" name="gender" required>
          <option selected disabled value="">Select your gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label" for="race_ethnicity">Race / Ethnicity</label>
        <select class="form-select" id="race_ethnicity" name="race_ethnicity" required>
          <option selected disabled value="">Select ethnicity</option>
          <option value="group A">Group A</option>
          <option value="group B">Group B</option>
          <option value="group C">Group C</option>
          <option value="group D">Group D</option>
          <option value="group E">Group E</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label" for="parental_level_of_education">Parental Level of Education</label>
        <select class="form-select" id="parental_level_of_education" name="parental_level_of_education" required>
          <option selected disabled value="">Select parent education</option>
          <option value="associate's degree">Associate's degree</option>
          <option value="bachelor's degree">Bachelor's degree</option>
          <option value="high school">High school</option>
          <option value="master's degree">Master's degree</option>
          <option value="some college">Some college</option>
          <option value="some high school">Some high school</option>
        </select>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label" for="lunch">Lunch Type</label>
          <select class="form-select" id="lunch" name="lunch" required>
            <option selected disabled value="">Select lunch type</option>
            <option value="free/reduced">Free/reduced</option>
            <option value="standard">Standard</option>
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="test_preparation_course">Test Preparation Course</label>
          <select class="form-select" id="test_preparation_course" name="test_preparation_course" required>
            <option selected disabled value="">Select course status</option>
            <option value="none">None</option>
            <option value="completed">Completed</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label" for="reading_score">Reading Score (out of 100)</label>
          <input class="form-control" id="reading_score" type="number" name="reading_score"
                 placeholder="0 - 100" min="0" max="100" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="writing_score">Writing Score (out of 100)</label>
          <input class="form-control" id="writing_score" type="number" name="writing_score"
                 placeholder="0 - 100" min="0" max="100" required>
        </div>
      </div>

      <div class="d-grid mt-2">
        <button class="btn btn-primary" type="submit">Predict your Maths Score</button>
      </div>
    </form>

    {% if results is defined and results is not none %}
    <div class="result">
      The predicted maths score is <strong>{{ results }}</strong>
    </div>
    {% endif %}
  </div>
</body>
</html>
